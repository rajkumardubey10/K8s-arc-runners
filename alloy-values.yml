alloy:
  configMap:
    content: |
      logging {
        level = "info"
      }

      # Discover pods
      discovery.kubernetes "pods" {
        role = "pod"
      }

      # Keep only ARC namespace
      discovery.relabel "arc_only" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "arc-runners"
          action        = "keep"
        }
      }

      # Add useful labels + build file path to pod logs
      discovery.relabel "arc_logs" {
        targets = discovery.relabel.arc_only.output

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        # IMPORTANT: where to read logs from on the node
        rule {
          source_labels = ["__meta_kubernetes_pod_uid","__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "__path__"
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      # Read logs from files (reliable for short-lived pods)
      loki.source.file "arc" {
        targets    = discovery.relabel.arc_logs.output
        forward_to = [loki.write.default.receiver]
      }

      # Send to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }